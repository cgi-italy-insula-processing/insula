group 'com.cgi.eoss.platform.core'
version '1.48.0'

apply plugin: 'java'
apply plugin: 'java-library'
apply plugin: 'jacoco'

jar {
    archiveBaseName = 'queues-core'
}

configurations {
    testClasses {
        extendsFrom(testImplementation)
    }
}

tasks.register('testJar', Jar) {
    archiveBaseName = 'test'
    from sourceSets.test.output
}

// add the jar generated by the testJar task to the testClasses dependency
artifacts {
    testClasses testJar
}

dependencies {
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    api 'org.springframework.boot:spring-boot-starter-activemq'
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    implementation 'org.apache.activemq:activemq-pool'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'com.google.guava:guava'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'junit:junit'
    testImplementation 'org.awaitility:awaitility'
}

jacoco {
    toolVersion = "0.8.9"
    reportsDir = file("$buildDir/jacoco")
}

jacocoTestReport {
    dependsOn test
    reports {
      xml.enabled true
      csv.enabled false
    }
}

test {
    finalizedBy jacocoTestReport
}
