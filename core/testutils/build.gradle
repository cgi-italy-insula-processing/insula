group 'com.cgi.eoss.platform.core'
version '1.48.0'

apply plugin: 'java'
apply plugin: 'java-library'
apply plugin: 'jacoco'

configurations {
    testClasses {
        extendsFrom(testImplementation)
    }
}

task testJar(type: Jar) {
    archiveClassifier = 'test'
    from sourceSets.test.output
}

// add the jar generated by the testJar task to the testClasses dependency
artifacts {
  testClasses testJar
}

// TODO Remove this when the dependency management plugin correctly excludes in >=4.0
configurations {
    compile.exclude group: 'javax.media', module: 'jai_core'
    implementation.exclude group: 'javax.media', module: 'jai_core'
}

dependencies {
    compileOnly('org.projectlombok:lombok')
    annotationProcessor('org.projectlombok:lombok')
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    implementation 'org.springframework:spring-webmvc'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-guava'

    testImplementation 'junit:junit'
    testImplementation 'org.hamcrest:hamcrest-junit'
    testImplementation 'com.squareup.okhttp3:mockwebserver'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.xmlunit:xmlunit-core'
    testImplementation 'org.xmlunit:xmlunit-matchers'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor('org.projectlombok:lombok')
}

jacoco {
    toolVersion = "0.8.9"
    reportsDir = file("$buildDir/jacoco")
}

jacocoTestReport {
    dependsOn test
    reports {
      xml.enabled true
      csv.enabled false
    }
}

test {
    finalizedBy jacocoTestReport
}

