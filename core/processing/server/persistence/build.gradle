group 'com.cgi.eoss.platform.core'
version '1.47.1-SNAPSHOT'

apply plugin: 'java'
apply plugin: 'java-library'
apply plugin: 'jacoco'

jar {
    archiveBaseName = 'persistence-core'
}

def generatedSourcesDir = "${buildDir}/generated/java"
sourceSets {
    generated {
        java {
            srcDirs += generatedSourcesDir
        }
    }
    main {
        java {
            srcDirs = ["src/main/java", generatedSourcesDir]
        }
    }
}

compileJava {
    doFirst {
        file(generatedSourcesDir).mkdirs()
    }
    options.getGeneratedSourceOutputDirectory().set(file(generatedSourcesDir))
}

configurations {
    testClasses {
        extendsFrom(testImplementation)
    }
}

tasks.register('testJar', Jar) {
    archiveBaseName = 'test'
    from sourceSets.test.output
}

// add the jar generated by the testJar task to the testClasses dependency
artifacts {
    testClasses testJar
}

test {
    systemProperty("user.timezone", "UTC")
}

dependencies {

    annotationProcessor "org.projectlombok:lombok"
    compileOnly 'org.projectlombok:lombok'

    api 'org.springframework.boot:spring-boot-starter-data-jpa'

    api project(':core:processing:server:model')

    implementation 'commons-codec:commons-codec'
    implementation 'com.google.guava:guava'
    implementation 'com.querydsl:querydsl-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    implementation('org.springframework.boot:spring-boot',
            'org.springframework.boot:spring-boot-autoconfigure')

    //  TODO: It should not be necessary to declare these items
    runtimeOnly 'org.postgresql:postgresql'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'junit:junit'
    testImplementation 'org.hamcrest:hamcrest-junit'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    testImplementation project(path: ':core:processing:server:model', configuration: 'testClasses')

    testRuntimeOnly 'org.hsqldb:hsqldb'

}

sonarqube {
    properties {
        property "sonar.exclusions", "${buildDir}/generated/**/*"
    }
}

jacoco {
    toolVersion = "0.8.9"
    reportsDir = file("$buildDir/jacoco")
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.enabled true
        csv.enabled false
    }
}

test {
    finalizedBy jacocoTestReport
}
