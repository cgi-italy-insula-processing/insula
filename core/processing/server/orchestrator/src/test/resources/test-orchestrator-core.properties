spring.datasource.url=jdbc:hsqldb:mem:platform
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.datasource.hikari.autoCommit=false

spring.flyway.enabled=true
spring.flyway.locations=db/migration/server-core/{vendor}
spring.jpa.hibernate.ddl-auto=validate

platform.server.app=processing-core

platform.orchestrator.job-inputs-validator.enabled=true

platform.orchestrator.mockserver.port=20022

platform.orchestrator.cwl.client.connectionTimeoutSeconds=2
platform.orchestrator.cwl.client.readTimeoutSeconds=3
platform.orchestrator.cwl.client.callTimeoutSeconds=5

platform.orchestrator.outputProducts.baseDir=./target/data/outputProducts
platform.orchestrator.jobOutputs.baseUrl=http://insula-test:8443/api/v2

platform.orchestrator.objectStorage.endpoint=http://localhost:${platform.orchestrator.mockserver.port}/s3
platform.orchestrator.objectStorage.accessKey=storage-ak
platform.orchestrator.objectStorage.secretKey=storage-sk
platform.orchestrator.objectStorage.insecure=true
platform.orchestrator.objectStorage.region=us-east-1
platform.orchestrator.objectStorage.jobOutputsBucketName=jobOutputs-bucket

platform.orchestrator.stac.inputs.service.connectionTimeoutSeconds=2
platform.orchestrator.stac.inputs.service.readTimeoutSeconds=3

# Broker configuration
spring.activemq.broker-url=tcp://127.0.0.1:61616?wireFormat.maxInactivityDuration=0&jms.messagePrioritySupported=true
spring.activemq.user=admin
spring.activemq.password=admin

platform.orchestrator.jobSubmitter.queue.name=platform-jobs
