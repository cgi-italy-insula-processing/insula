group = 'com.cgi.eoss.platform.core'
version '1.48.0'

apply plugin: 'java'
apply plugin: 'java-library'
apply plugin: 'jacoco'

jar {
    archiveBaseName = 'orchestrator-core'
}

def generatedSourcesDir = "${buildDir}/generated/java"
sourceSets {
    generated {
        java {
            srcDirs += generatedSourcesDir
        }
    }
    main {
        java {
            srcDirs = ["src/main/java", generatedSourcesDir]
        }
    }
}

compileJava {
    doFirst {
        file(generatedSourcesDir).mkdirs()
    }
    options.getGeneratedSourceOutputDirectory().set(file(generatedSourcesDir))
}

configurations {
    testClasses {
        extendsFrom(testImplementation)
    }
}

tasks.register('testJar', Jar) {
    archiveBaseName = 'test'
    from sourceSets.test.output
}

// add the jar generated by the testJar task to the testClasses dependency
artifacts {
    testClasses testJar
}

dependencies {
    annotationProcessor "org.projectlombok:lombok"
    compileOnly 'org.projectlombok:lombok'

    implementation project(':core:processing:server:model')
    implementation project(':core:processing:server:persistence')

    implementation project(':core:processing:rpc')
    implementation project(':core:queues')

    implementation 'com.amazonaws:aws-java-sdk-s3'
    implementation 'com.squareup.okhttp3:okhttp'
    implementation 'com.squareup.okhttp3:logging-interceptor'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.google.guava:guava'
    implementation 'org.apache.commons:commons-lang3'
    implementation 'org.locationtech.jts:jts-core'
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework.boot:spring-boot'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    implementation 'com.cgi.eoss.cwl_v1_2:cwl_v1_2'
    implementation 'org.snakeyaml:snakeyaml-engine'

    implementation 'org.apache.commons:commons-text'
    implementation 'org.apache.commons:commons-compress'

    implementation 'org.apache.activemq:activemq-pool'
    implementation 'org.springframework.boot:spring-boot-starter-activemq'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'junit:junit'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.squareup.okhttp3:mockwebserver'
    testImplementation 'com.google.jimfs:jimfs'
    testImplementation 'org.awaitility:awaitility'

    testImplementation project(path: ':core:queues', configuration: 'testClasses')
    testImplementation project(path: ':core:processing:server:model', configuration: 'testClasses')
    testImplementation project(path: ':core:processing:server:persistence', configuration: 'testClasses')
    testImplementation project(path: ':core:testutils', configuration: 'testClasses')

    testRuntimeOnly 'org.hsqldb:hsqldb'

}

tasks.withType(Test) {
    systemProperties['user.timezone'] = "UTC"
}

sonarqube {
    properties {
        property "sonar.exclusions", "${buildDir}/generated/**/*"
    }
}

jacoco {
    toolVersion = "0.8.9"
    reportsDir = file("$buildDir/jacoco")
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.enabled true
        csv.enabled false
    }
}

test {
    finalizedBy jacocoTestReport
}