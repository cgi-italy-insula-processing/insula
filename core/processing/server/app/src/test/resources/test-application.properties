application.title=Processing Server Core
server.port=9090
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/json,application/hal+json
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=6000MB
spring.servlet.multipart.max-request-size=6000MB
server.undertow.max-request-size=6000MB
server.undertow.max-http-post-size=6000MB

spring.main.allow-bean-definition-overriding=true

# APPLICATION CONFIGURATION

platform.server.app=processing-core


# Spring Persistence configuration
spring.flyway.enabled=true
spring.flyway.locations=db/migration/server-core/{vendor}
spring.jpa.hibernate.ddl-auto=validate


# Database connection
spring.datasource.url=jdbc:hsqldb:mem:platform
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.datasource.hikari.autoCommit=false

# API module configuration
platform.api.basePath=/api
platform.cwl.mockserver.port=10012

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Broker configuration
spring.activemq.broker-url=tcp://127.0.0.1:61616?wireFormat.maxInactivityDuration=0&jms.messagePrioritySupported=true
spring.activemq.user=admin
spring.activemq.password=admin
platform.orchestrator.job.stopper.pendingQueueName=platform-pending-jobs
platform.orchestrator.job.stopper.waitingQueueName=platform-jobs
platform.orchestrator.jobSubmitter.queue.name=platform-jobs

# Job outputs configuration
platform.orchestrator.outputProducts.baseDir=./target/data/outputProducts
platform.orchestrator.jobOutputs.baseUrl=http://insula-test:8443/api
