buildscript {
    dependencies {
        classpath pl.springBoot
        classpath pl.docker
    }
}

group 'com.cgi.eoss.platform.core'
version '1.47.1-SNAPSHOT'

apply plugin: 'java'
apply plugin: 'jacoco'

apply plugin: 'org.springframework.boot'
apply plugin: 'com.bmuschko.docker-remote-api'

configurations {
    testClasses {
        extendsFrom(testImplementation)
    }
}

tasks.register('testJar', Jar) {
    archiveBaseName = 'test'
    from sourceSets.test.output
}

// add the jar generated by the testJar task to the testClasses dependency
artifacts {
    testClasses testJar
}

dependencies {

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation project(':core:processing:server:persistence')
    implementation project(':core:processing:server:orchestrator')

    implementation(
            'com.fasterxml.jackson.datatype:jackson-datatype-guava',
            'com.fasterxml.jackson.datatype:jackson-datatype-hibernate5',
            'com.fasterxml.jackson.datatype:jackson-datatype-jdk8',
            'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    )

    implementation(
            'org.springframework:spring-context',
            'org.springframework:spring-webmvc',
            'org.springframework.boot:spring-boot-autoconfigure',
            'org.springframework.boot:spring-boot-starter-actuator',
            'org.springframework.boot:spring-boot-starter-log4j2',
            'org.springframework.boot:spring-boot-starter-undertow',
            'org.springframework.boot:spring-boot-starter-hateoas',
            'org.springframework.security:spring-security-config',
            'org.springframework.security:spring-security-web',
            'org.springframework.boot:spring-boot-starter-data-rest',
            'org.springframework.data:spring-data-rest-hal-explorer'
    )

    testImplementation (
            'org.springframework:spring-test',
            'org.springframework.boot:spring-boot-starter-test'
    )

    testImplementation 'com.squareup.okhttp3:mockwebserver'
    testImplementation 'org.awaitility:awaitility'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor('org.projectlombok:lombok')

    testImplementation project(path: ':core:processing:server:model', configuration: 'testClasses')
    testImplementation project(path: ':core:processing:server:orchestrator', configuration: 'testClasses')
    testImplementation project(path: ':core:processing:server:persistence', configuration: 'testClasses')
    testImplementation project(path: ':core:queues', configuration: 'testClasses')
    testImplementation project(path: ':core:testutils', configuration: 'testClasses')
    testImplementation project(path: ':core:processing:rpc')

//  TODO: It should not be necessary to declare these items
    testRuntimeOnly 'org.hsqldb:hsqldb'
    implementation 'com.querydsl:querydsl-jpa'
}

bootJar {
    setArchiveClassifier('bin')
    launchScript()
    archiveBaseName = 'server-core'
}

jar {
    archiveBaseName = 'server-core'
}

docker {
    registryCredentials {
        url = project.hasProperty('DOCKER_REGISTRY_URL') ? project.property('DOCKER_REGISTRY_URL') : ''
        username = project.hasProperty('DOCKER_REGISTRY_USERNAME') ? project.property('DOCKER_REGISTRY_USERNAME') : ''
        password = project.hasProperty('DOCKER_REGISTRY_PASSWORD') ? project.property('DOCKER_REGISTRY_PASSWORD') : ''
        email = project.hasProperty('DOCKER_REGISTRY_EMAIL') ? project.property('DOCKER_REGISTRY_EMAIL') : ''
    }
}

import com.bmuschko.gradle.docker.tasks.image.DockerBuildImage
import com.bmuschko.gradle.docker.tasks.image.DockerPullImage
import com.bmuschko.gradle.docker.tasks.image.DockerPushImage

task pullDockerImage(type: DockerPullImage) {
    if (project.hasProperty("DOCKER_REGISTRY_URL")) {
        image = project.getProperties().get("DOCKER_REGISTRY_URL") + "/" + "${project.group}/${jar.archiveBaseName.get()}:latest"
    } else {
        image = "${project.group}/${jar.archiveBaseName.get()}:latest"
    }
    onError { exception ->

    }
}

task buildDockerImage(type: DockerBuildImage) {
    dependsOn bootJar, pullDockerImage
    inputDir = file('.')
    if (project.hasProperty("DOCKER_REGISTRY_URL")) {
        images.add(project.getProperties().get("DOCKER_REGISTRY_URL") + "/" + "${project.group}/${jar.archiveBaseName.get()}:${project.version}")
        images.add(project.getProperties().get("DOCKER_REGISTRY_URL") + "/" + "${project.group}/${jar.archiveBaseName.get()}:latest")
        cacheFrom.add(project.getProperties().get("DOCKER_REGISTRY_URL") + "/" + "${project.group}/${jar.archiveBaseName.get()}:latest")
    } else {
        images.add("${project.group}/${jar.archiveBaseName.get()}:${project.version}")
        images.add("${project.group}/${jar.archiveBaseName.get()}:latest")
        cacheFrom.add("${project.group}/${jar.archiveBaseName.get()}:latest")
    }
    def base_image = project.getProperties().get("container.docker.baseImage") as String
    project.logger.info("Read {} from gradle.properties file as base image.", base_image)
    buildArgs = ['JAR_FILE'  : "target/libs/${jar.archiveBaseName.get()}-${project.version}-bin.jar",
                 'BASE_IMAGE': base_image]
}

task pushLatestDockerImage(type: DockerPushImage) {
    images = [project.getProperties().get("DOCKER_REGISTRY_URL") + "/" + "${project.group}/${jar.archiveBaseName.get()}:latest"]
}

task pushCurrentVersionDockerImage(type: DockerPushImage) {
    images = [project.getProperties().get("DOCKER_REGISTRY_URL") + "/" + "${project.group}/${jar.archiveBaseName.get()}:${project.version}"]
}

task pushDockerImage() {
    dependsOn pushLatestDockerImage, pushCurrentVersionDockerImage
}

jacoco {
    toolVersion = "0.8.9"
    reportsDir = file("$buildDir/jacoco")
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.enabled true
        csv.enabled false
    }
}

test {
    finalizedBy jacocoTestReport
}