group 'com.cgi.eoss.platform.core'
version '1.47.1-SNAPSHOT'

apply plugin: 'java'
apply plugin: 'java-library'
apply plugin: 'jacoco'

jar {
    archiveBaseName = 'model-core'
}

def generatedSourcesDir = "${buildDir}/generated/java"
sourceSets {
    generated {
        java {
            srcDirs += generatedSourcesDir
        }
    }
    main {
        java {
            srcDirs = ["src/main/java", generatedSourcesDir]
        }
    }
}

compileJava {
    doFirst {
        file(generatedSourcesDir).mkdirs()
    }
    options.getGeneratedSourceOutputDirectory().set(file(generatedSourcesDir))
}

configurations {
    testClasses {
        extendsFrom(testImplementation)
    }
}

tasks.register('testJar', Jar) {
    archiveBaseName = 'test'
    from sourceSets.test.output
}

// add the jar generated by the testJar task to the testClasses dependency
artifacts {
    testClasses testJar
}

dependencies {

    annotationProcessor "com.querydsl:querydsl-apt"
    annotationProcessor "com.querydsl:querydsl-apt::jpa"
    annotationProcessor "javax.persistence:javax.persistence-api"
    annotationProcessor "javax.annotation:javax.annotation-api"
    annotationProcessor "org.projectlombok:lombok"

    compileOnly 'org.projectlombok:lombok'

    implementation 'com.google.guava:guava'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-guava'
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    implementation 'org.hibernate:hibernate-core'

    api 'com.querydsl:querydsl-core'
    api 'com.fasterxml.jackson.core:jackson-annotations'
    api 'com.fasterxml.jackson.core:jackson-databind'
    api 'javax.persistence:javax.persistence-api:2.2'
    api 'org.springframework.security:spring-security-core'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'junit:junit'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

sonarqube {
    properties {
        property "sonar.exclusions", "${buildDir}/generated/**/*"
    }
}

jacoco {
    toolVersion = "0.8.9"
    reportsDir = file("$buildDir/jacoco")
}

jacocoTestReport {
    dependsOn test
    reports {
      xml.enabled true
      csv.enabled false
    }
}

test {
    finalizedBy jacocoTestReport
}
