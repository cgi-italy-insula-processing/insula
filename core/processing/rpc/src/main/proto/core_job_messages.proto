syntax = "proto3";

package com.cgi.eoss.platform;

import "core_common_messages.proto";

option java_multiple_files = true;
option java_package = "com.cgi.eoss.platform.rpc";

enum Kind {
  WORKFLOW = 0;
  INTERACTIVE = 1;
}

message JobSpec {
  Service service = 1;
  Job job = 2;
  repeated JobParam inputs = 3;
  int32 timeoutValue = 4;
  repeated string exposedPorts = 5;
  repeated string userBinds = 6 [deprecated = true];
  ResourceRequest resourceRequest = 7;
  map<string, string> environmentVariables = 8;
  repeated string persistentFolders = 9;
  Kind kind = 10;
  bool stripProxyPath = 11;
  repeated string sharingUsersNames = 12;
  string dockerCommand = 13;
  repeated string dockerArguments = 14;
  repeated JobParam outputs = 15;
  repeated UserMount userMount = 16;
}

message ResourceRequest{
  int32 storage = 1;
  string cpus = 2;
  string ram = 3;
  string gpus = 4;
  SharedMemory sharedMemory = 5;
  ResourceSpec limits = 6;
}

message SharedMemory{
  string size = 1;
}

message ResourceSpec {
  string ram = 1;
  string cpu = 2;
}

message StopJob {
  Job job = 1;
  Kind kind = 2;
}

message UserMount {
  string name = 1;
  string mountPath = 2;
  string type = 3;
  string targetPath = 4;
}
