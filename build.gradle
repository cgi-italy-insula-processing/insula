    configurations.all {
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'org.apache.logging.log4j') {
                details.useVersion '2.25.4'
            }
            if (details.requested.group == "org.springframework" && details.requested.name == "spring-web") {
                details.useVersion '5.3.36'
            }
            if (details.requested.group == "org.springframework.security" && (details.requested.name == "spring-security-core" || details.requested.name == "spring-security-web")) {
                details.useVersion '5.7.13'
            }
            if (details.requested.group == "org.jboss.xnio") {
                details.useVersion '3.8.15.Final'  // org.springframework.boot:spring-boot-starter-undertow CVE
            }
        }
    }

