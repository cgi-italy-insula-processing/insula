subprojects {
    afterEvaluate { project ->
        if (!project.sonarqube.skipProject) {
            sonarqube {
                String regex = "(.*)/(.*)"
                String projectKey = project.name.replaceAll(regex, "\$1:\$2")
                String sonarModuleKey = rootProject.group + ':' + rootProject.name + ':' + projectKey

                properties {
                    property 'sonar.coverage.jacoco.xmlreportPaths', "${project.buildDir}/jacoco/test/*.xml, ${rootProject.buildDir}/jacoco/test/*.xml"
                    property "sonar.moduleKey", sonarModuleKey
                }
            }
        }
    }
    tasks.withType(Test) {
        useJUnit()

        beforeTest { descriptor ->
            logger.lifecycle("${descriptor.className}.${descriptor.name}: STARTED")
        }

        afterTest { descriptor, result ->
            logger.lifecycle("${descriptor.className}.${descriptor.name}: ${result.resultType}")
        }
    }

}

